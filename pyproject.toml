[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foodinsightai-backend"
version = "0.2.0"
description = "Food recognition and nutrition intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0", "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0", "python-multipart>=0.0.9",
  "httpx>=0.27,<1.0", "pillow>=10.4,<12.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0", "httpx>=0.27,<1.0"]
vision = ["torch>=2.3,<3.0", "numpy>=1.26,<3.0"]
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
